# yaml-language-server: $schema=../../spore-os-protocol/versions/v0d2/spore.manifest.v0.schema.yaml

id: dev.sporeos.SPORE
name: Spore OS
description: The central hub of the Spore ecosystem.
trust: system

schema: SPORE/v0d2
version: 0.2.0
app: n/a

launch: auto
namespace: spore

api:
  - name: help
    description: Get help.
    risk: benign
    usage:
      - help
    inputs:
      - name: body
        type: string
        description: Help request body.
        required: true
    outputs:
      - name: body
        type: string
        description: The original body.
    # if called on node
      - name: id
        type: string 
        description: Node ID.
      - name: name
        type: string
        description: Node name.
      - name: description
        type: string
        description: Node description.
      - name: trust
        type: string
        description: Node trust level.
      - name: schema
        type: string
        description: Schema.
      - name: version
        type: string
        description: Spore OS target version.
      - name: app
        type: string
        description: Relative path to node from manifest file.
      - name: launch
        type: string
        description: Launch mode of the node (Auto, Lazy, Manual).
      - name: namespace
        type: string
        description: Runtime namespace (Hyphae, Spore, Any).
      - name: witness
        type: bool
        description: Whether the node is a witness.

  - name: state
    description: Get runtime state.
    risk: standard
    usage:
      - state
    inputs: []
    outputs:
      - name: body
        type: string
        description: The original body.
    # if called on node
      - name: manifest
        type: string
        description: "Absolute path to manifest file."
      - name: binary
        type: string
        description: "Absolute path to binary file."
      - name: connected
        type: bool
        description: Whether the node is connected.

  - name: list
    description: List children.
    risk: standard
    usage:
      - list 
    inputs: 
      - name: body
        type: string
        description: .
        required: true
    outputs:
      - name: body
        type: string
        description: The original body.
    # if called on node
      - name: api
        type: array
        description: List of request calls.
      - name: topics
        type: array
        description: List of topics.
      - name: errors
        type: array
        description: List of defined error codes.
      - name: permissions
        type: array
        description: List of permissions listed in the manifest.

  - name: complete
    description: Get command completions.
    risk: standard
    usage:
      - complete body=""
    inputs:
      - name: body
        type: string
        description: Partial command input.
        required: true
    outputs:
      - name: body
        type: string
        description: The original body.
      - name: completions
        type: array
        description: List of possible completions.

  - name: hint
    description: Get hints for using Spore OS.
    risk: standard
    usage:
      - hint body=""
      - hint body="SPORE.no"
      - hint body="SPORE.node.spawn"
    inputs: 
      - name: body
        type: string
        description: Hint body.
        required: true
      - name: cursor
        type: integer
        description: Cursor position within the body.
        required: true
    outputs: 
      - name: body
        type: string
        description: The original body.
      - name: open
        type: any
        description: Some combination of commands 'help', 'state', 'list', and 'complete'.

# ==================================================================================
# SPORE.node

  - name: node.install
    description: Install a node.
    risk: protected
    usage:
      - node.install path=/path/to/manifest/node.manifest.spore.yaml
    inputs:
      - name: path
        type: string
        description: Path to .manifest.spore.yaml file.
        required: true
    outputs: []

  - name: node.uninstall
    description: Uninstall a node.
    risk: protected
    usage:
      - node.uninstall node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: false
    outputs: []

  - name: node.spawn
    description: Start a node.
    risk: standard
    usage:
      - node.spawn node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs: []

  - name: node.kill
    description: Stop a node.
    risk: standard
    usage:
      - node.kill node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs: []

# ==================================================================================
# SPORE.topic

  - name: topic.subscribe
    description: Subscribe to a topic.
    risk: standard
    usage:
      - topic.subscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

  - name: topic.unsubscribe
    description: Unsubscribe to a topic.
    risk: standard
    usage:
      - topic.unsubscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

# ==================================================================================
# SPORE.permission

  - name: permission.request
    description: Request permission. Called by nodes, granted or denied by user.
    risk: standard
    usage:
      - permission.request node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Fully-qualified capability ID.
        required: true
      - name: reasons
        type: array
        description: Reasons for requesting permission.
        required: false
    outputs:
      - name: yes
        type: flag
        description: Flag present if granted.
      - name: no
        type: flag
        description: Flag present if denied.
  
  - name: permission.grant
    description: Grant permission to a node for a capability.
    risk: standard
    usage:
      - permission.grant node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Fully-qualified capability ID.
        required: true
    outputs: []
  
  - name: permission.revoke
    description: Revoke permission from a node for a capability.
    risk: standard
    usage:
      - permission.revoke node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Fully-qualified capability ID.
        required: true
    outputs: []
  
# ==================================================================================
# other

topics: []
permissions: []
errors: []
          