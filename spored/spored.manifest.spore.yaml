# yaml-language-server: $schema=../../spore-os-protocol/versions/v0d2/spore.manifest.v0.schema.yaml

id: dev.sporeos.SPORE
name: Spore OS
description: The central hub of the Spore ecosystem.
trust: system

schema: SPORE/v0d2
version: 0.2.0
app: n/a

api:
  - name: SPORE.help
    description: Get generic help.
    risk: benign
    usage:
      - SPORE.node.help
    outputs:
      - name: nodeinfo
        type: object
        description: Node information of dev.sporeos.SPORE

  - name: SPORE.node.install
    description: Install a node.
    risk: protected
    usage:
      - SPORE.node.install path=/path/to/manifest/node.manifest.spore.yaml
    inputs:
      - name: path
        type: string
        description: Path to .manifest.spore.yaml file.
        required: true
    outputs: []

  - name: SPORE.node.uninstall
    description: Uninstall a node.
    risk: protected
    usage:
      - SPORE.node.uninstall node=node
    inputs:
      - name: node
        type: string
        description: Node ID
        required: false
      - name: path
        type: string
        description: Path to .manifest.spore.yaml file.
        required: false
    outputs: []
    notes:
      - Only one of 'node', 'path' required.

  - name: SPORE.node.spawn
    description: Start a node.
    risk: standard
    usage:
      - SPORE.node.spawn node=node
    inputs:
      - name: node
        type: string
        description: Node ID
        required: true
    outputs: []
    notes:
      - Nodes will spawn headless.

  - name: SPORE.node.kill
    description: Stop a node.
    risk: standard
    usage:
      - SPORE.node.kill node=node
    inputs:
      - name: node
        type: string
        description: Node ID
        required: true
    outputs: []

  - name: SPORE.node.list
    description: Get a list of installed nodes by ID.
    risk: standard
    usage:
      - SPORE.node.list
      - SPORE.node.list connected
    inputs:
      - name: connected
        type: flag
        description: Append the 'connected' token to each node that is currently connected.
    outputs:
      - name: nodes
        type: array
        description: List of node IDs. Additional information controlled by flags.

  - name: SPORE.node.help
    description: Get help with a node.
    risk: standard
    usage:
      - SPORE.node.help node=node
    inputs:
      - name: node
        type: string
        description: Node ID
        required: true
    outputs:
      - name: nodeinfo
        type: object
        description: Node information

  - name: SPORE.command.list
    description: Get list of commands.
    risk: standard
    usage:
      - SPORE.command.list
        SPORE.command.list node=node
    inputs:
      - name: node
        type: string
        description: Node ID. Omit for all.
        required: false
    outputs:
      - name: commands
        type: array
        description: List of commands.

  - name: SPORE.command.help
    description: Get help with a command.
    risk: standard
    usage:
      - SPORE.command.help command=command
    inputs:
      - name: command
        type: string
        description: Command shorthand.
        required: true
    outputs:
      - name: commandinfo
        type: object
        description: Command information.

  - name: SPORE.error.list
    description: Get a list of error codes.
    risk: standard
    usage:
      - SPORE.error.list
      - SPORE.error.list node=node
    inputs:
      - name: node
        type: string
        description: Node ID. Omit for standard error codes.
        required: false
    outputs:
      - name: errors
        type: array
        description: List of error code names.

  - name: SPORE.error.help
    description: Get help for an error code.
    risk: standard
    usage:
      - SPORE.error.help errorcode=RouteNotFound
      - SPORE.error.help errorcode=clock.err.invalid_timezone
    inputs:
      - name: errorcode
        type: string
        description: Error code.
        required: true
    outputs:
      - name: errorinfo
        type: object
        description: Error information.

  - name: SPORE.topic.list
    description: Get list of topics.
    risk: standard
    usage:
      - SPORE.topic.list
      - SPORE.topic.list node=node
    inputs:
      - name: node
        type: string
        description: Node ID. Omit for all.
        required: false
    outputs:
      - name: topics
        type: array
        description: List of topics.

  - name: SPORE.topic.help
    description: Get help for a topic.
    risk: standard
    usage:
      - SPORE.topic.help topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs:
      - name: topicinfo
        type: object
        description: Topic information.

  - name: SPORE.topic.subscribe
    description: Subscribe to a topic.
    risk: standard
    usage:
      - SPORE.topic.subscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

  - name: SPORE.topic.unsubscribe
    description: Unsubscribe to a topic.
    risk: standard
    usage:
      - SPORE.topic.unsubscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

  - name: SPORE.permission.list
    description: Get list of permissions.
    risk: standard
    usage:
      - SPORE.permission.list
      - SPORE.permission.list node=node
      - SPORE.permission.list command=command
      - SPORE.permission.list topic=topic
      - SPORE.permission.list node=node command=command topic=topic
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: false
      - name: command
        type: string
        description: Command shorthand.
        required: true
      - name: topic
        type: string
        description: Subscription topics.
        required: true
    outputs:
      - name: permissions
        type: array
        description: List of permission-relationships.
      
  - name: SPORE.permission.request
    description: Request permission. Called by nodes, granted or denied by user.
    risk: standard
    usage:
      - SPORE.permission.request command=command
      - SPORE.permission.request topic=topic
    inputs:
      - name: command
        type: string
        description: Command shorthand.
        required: false
      - name: topic
        type: string
        description: Subscription topics.
        required: true
    outputs:
      - name: granted
        type: flag
        description: Flag present if granted.
      - name: denied
        type: flag
        description: Flag present if denied.
  
  - name: SPORE.permission.grant
    description: Grant permission to a node for a capability.
    risk: standard
    usage:
      - SPORE.permission.grant node=node command=command
      - SPORE.permission.grant node=node topic=topic
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: command
        type: string
        description: Command shorthand.
        required: false
      - name: topic
        type: string
        description: Subscription topics.
        required: false
    outputs: []
  
  - name: SPORE.permission.revoke
    description: Revoke permission from a node for a capability.
    risk: standard
    usage:
      - SPORE.permission.revoke node=node command=command
      - SPORE.permission.revoke node=node topic=topic
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: command
        type: string
        description: Command shorthand.
        required: false
      - name: topic
        type: string
        description: Subscription topics.
        required: false
    outputs: []
    
  - name: SPORE.security.keyring.grant
    description: Grant trust to a public key on the security keyring.
    risk: protected
    usage:
      - SPORE.security.keyring.grant path=/path/to/key.gpg
    inputs:
      - name: path
        type: string
        description: Path to .gpg file.
        required: true
    outputs: []

  - name: SPORE.security.keyring.revoke
    description: Revoke trust of a public key from the security keyring.
    risk: protected
    usage:
      - SPORE.security.keyring.revoke key=key
    inputs:
      - name: key
        type: string
        description: Public key.
        required: true
    outputs: []
  
  - name: SPORE.security.keyring.list
    description: List all public keys on the security keyring.
    risk: protected
    usage:
      - SPORE.security.keyring.list
    inputs: []
    outputs: 
      - name: keys
        type: string
        description: List of public keys on the keyring.

  - name: SPORE.security.keyring.info
    description: Query data of a public key on the security keyring.
    risk: protected
    usage:
      - SPORE.security.keyring.info key=key
    inputs:
      - name: key
        type: string
        description: Public key.
        required: true
    outputs:
      - name: keyinfo
        type: object
        description: Public key information.

  - name: SPORE.security.signature.sign
    description: Sign a file, producing a signature file.
    risk: protected
    usage:
      - SPORE.security.signature.sign path=/path/to/file.* passphrase=passphrase
    inputs:
      - name: path
        type: string
        description: Path to file to sign.
        required: true
      - name: passphrase
        type: string
        description: Passphrase to access private key.
        required: true
    outputs:
      - name: signature
        type: string
        description: Path to signature (*.sig) file.
  
  - name: SPORE.security.signature.verify
    description: Verify a file via its signature file.
    risk: protected
    usage:
      - SPORE.security.signature.verify path=/path/to/file.* signature=/path/to/file.sig key=key
    inputs:
      - name: path
        type: string
        description: Path to file to verify.
        required: true
      - name: signature
        type: string
        description: Path to signature file.
        required: true
      - name: key
        type: string
        description: Public key.
        required: true
    outputs:
      - name: verified
        type: flag
        description: Flag present if verification successful.
      - name: failed
        type: flag
        description: Flag present if verification failed.

topics:
  - name: SPORE.node.installed
    description: Published on node installation.
    risk: standard
    usage:
      - publish SPORE.node.installed node=node
    outputs:
      - name: node
        type: string
        description: Node ID.
        
  - name: SPORE.node.uninstalled
    description: Published on node uninstallation.
    risk: standard
    usage:
      - publish SPORE.node.uninstalled node=node
    outputs:
      - name: node
        type: string
        description: Node ID.

  - name: SPORE.node.spawned
    description: Published on node process spawned.
    risk: standard
    usage:
      - publish SPORE.node.spawned node=node
    outputs:
      - name: node
        type: string
        description: Node ID.

  - name: SPORE.node.killed
    description: Published on node process killed.
    risk: standard
    usage:
      - publish SPORE.node.killed node=node
    outputs:
      - name: node
        type: string
        description: Node ID.
          