# yaml-language-server: $schema=../../spore-os-protocol/versions/v0d3/spore.manifest.v0.schema.yaml

id: dev.sporeos.SPORE
name: Spore OS
description: The central hub of the Spore ecosystem.
trust: system

schema: SPORE/v0d3
version: 0.3.0
app: n/a

launch: auto
namespace: spore

api:

# ==================================================================================
# SPORE.node

  - name: node.install
    description: Install a node.
    risk: admin
    usage:
      - node.install path=/path/to/manifest/node.manifest.spore.yaml
      - node.install path=/path/to/manifest/node.manifest.spore.yaml load
    inputs:
      - name: path
        type: string
        description: Path to .manifest.spore.yaml file.
        required: true
      - name: load
        type: flag
        description: Spawn the node after it is installed.
        required: false
    outputs: []

  - name: node.uninstall
    description: Uninstall a node.
    risk: admin
    usage:
      - node.uninstall node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: false
    outputs: []

  - name: node.reinstall
    description: Reinstall a node from its registered manifest path.
    risk: admin
    usage:
      - node.reinstall node=node
      - node.reinstall node=node load
    inputs:
      - name: node
        type: string
        description: Installed node ID.
        required: true
      - name: load
        type: flag
        description: Spawn the node after it is reinstalled.
        required: false
    outputs: []

  - name: node.spawn
    description: Start a node.
    risk: standard
    usage:
      - node.spawn node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs: []

  - name: node.reload
    description: Restart a node.
    risk: standard
    usage:
      - node.reload node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs: []

  - name: node.kill
    description: Stop a node.
    risk: standard
    usage:
      - node.kill node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs: []

# ==================================================================================
# SPORE.topic

  - name: topic.subscribe
    description: Subscribe to a topic.
    risk: standard
    usage:
      - topic.subscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

  - name: topic.unsubscribe
    description: Unsubscribe to a topic.
    risk: standard
    usage:
      - topic.unsubscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

# ==================================================================================
# SPORE.permission

  - name: permission.request
    description: Request a 30-second, single-use permission token for the calling node.
    risk: standard
    usage:
      - permission.request capability=capability
    inputs:
      - name: capability
        type: string
        description: Fully-qualified capability ID.
        required: true
      - name: reasons
        type: array
        description: Reasons for requesting permission.
        required: false
    outputs:
      - name: permission.token
        type: string
        description: Opaque 30-second, single-use token for the requested capability.
      - name: no
        type: flag
        description: Flag present if denied.
  
  - name: permission.grant
    description: Grant permission to a node for a capability.
    risk: admin
    usage:
      - permission.grant node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Fully-qualified capability ID.
        required: true
    outputs: []
  
  - name: permission.revoke
    description: Revoke permission from a node for a capability.
    risk: admin
    usage:
      - permission.revoke node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Fully-qualified capability ID.
        required: true
    outputs: []

# ==================================================================================
# SPORE.persistence

  - name: state.persist
    description: Persist state by key as a string blob.
    risk: standard
    usage:
      - state.persist
    inputs: 
      - name: key
        type: string
        description: Data key.
        required: true
      - name: body
        type: string
        description: String blob to persist.
        required: true
    outputs: []
    notes:
      - Data persisted stays associated to the node.
  
  - name: state.retrieve
    description: Retrieve state by key as a string blob.
    risk: standard
    usage:
      - state.retrieve key=key
    inputs:
      - name: key
        type: string
        description: Data key.
        required: true
    outputs:
      - name: body
        type: string
        description: String blob to retrieve.
      - name: empty
        type: flag
        description: Flag present if no data is found for the given key.
    notes:
      - Nodes can only retrieve data they have persisted.
  
# ==================================================================================
# other

topics: []
permissions: []
          