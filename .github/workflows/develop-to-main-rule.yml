name: "'main' only accepts from 'develop'"
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is develop
        if: github.head_ref != 'develop'
        run: |
          echo "::error::Merges to 'main' are only allowed from 'develop'. Current source: ${{ github.head_ref }}"
          exit 1   