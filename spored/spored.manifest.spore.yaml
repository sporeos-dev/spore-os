# yaml-language-server: $schema=../../spore-os-protocol/versions/v0d2/spore.manifest.v0.schema.yaml

id: dev.sporeos.SPORE
name: Spore OS
description: The central hub of the Spore ecosystem.
trust: system

schema: SPORE/v0d2
version: 0.2.0
app: n/a

api:
  - name: SPORE.help
    description: Get generic help for Spore OS.
    risk: benign
    usage:
      - SPORE.help
    inputs: []
    outputs:
      - name: help
        type: object
        description: Generic help information.

  - name: SPORE.info
    description: Get application information.
    risk: standard
    usage:
      - SPORE.info
    inputs: []
    outputs:
      - name: info
        type: object
        description: Spore OS information.

  - name: SPORE.state
    description: Get application state.
    risk: standard
    usage:
      - SPORE.state
    inputs: []
    outputs:
      - name: state
        type: object
        description: Spore OS state.

# ==================================================================================
# SPORE.node

  - name: SPORE.node.list
    description: Get a list of installed nodes by ID.
    risk: standard
    usage:
      - SPORE.node.list
    inputs: []
    outputs:
      - name: nodes
        type: array
        description: List of node IDs.

  - name: SPORE.node.help
    description: Get help with a node.
    risk: standard
    usage:
      - SPORE.node.help node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs:
      - name: nodehelp
        type: object
        description: Node help information.

  - name: SPORE.node.state
    description: Get node state.
    risk: standard
    usage:
      - SPORE.node.state node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs:
      - name: nodestate
        type: object
        description: Node state.

  - name: SPORE.node.install
    description: Install a node.
    risk: protected
    usage:
      - SPORE.node.install path=/path/to/manifest/node.manifest.spore.yaml
    inputs:
      - name: path
        type: string
        description: Path to .manifest.spore.yaml file.
        required: true
    outputs: []

  - name: SPORE.node.uninstall
    description: Uninstall a node.
    risk: protected
    usage:
      - SPORE.node.uninstall node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: false
    outputs: []

  - name: SPORE.node.spawn
    description: Start a node.
    risk: standard
    usage:
      - SPORE.node.spawn node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs: []

  - name: SPORE.node.kill
    description: Stop a node.
    risk: standard
    usage:
      - SPORE.node.kill node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs: []

# ==================================================================================
# SPORE.command

  - name: SPORE.command.list
    description: Get list of commands.
    risk: standard
    usage:
      - SPORE.command.list
        SPORE.command.list node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: false
    outputs:
      - name: commands
        type: array
        description: List of commands.

  - name: SPORE.command.help
    description: Get help with a command.
    risk: standard
    usage:
      - SPORE.command.help command=command
    inputs:
      - name: command
        type: string
        description: Command shorthand.
        required: true
    outputs:
      - name: commandhelp
        type: object
        description: Command help information.

# ==================================================================================
# SPORE.error

  - name: SPORE.error.list
    description: Get a list of error codes.
    risk: standard
    usage:
      - SPORE.error.list
      - SPORE.error.list node=node
    inputs:
      - name: node
        type: string
        description: Node ID. Omit for standard error codes.
        required: false
    outputs:
      - name: errors
        type: array
        description: List of error code names.

  - name: SPORE.error.help
    description: Get help for an error code.
    risk: standard
    usage:
      - SPORE.error.help errorcode=RouteNotFound
      - SPORE.error.help errorcode=clock.err.invalid_timezone
    inputs:
      - name: errorcode
        type: string
        description: Error code.
        required: true
    outputs:
      - name: errorhelp
        type: object
        description: Error help information.

# ==================================================================================
# SPORE.topic

  - name: SPORE.topic.list
    description: Get list of topics.
    risk: standard
    usage:
      - SPORE.topic.list
      - SPORE.topic.list node=node
    inputs:
      - name: node
        type: string
        description: Node ID. Omit for all.
        required: false
    outputs:
      - name: topics
        type: array
        description: List of topics.

  - name: SPORE.topic.help
    description: Get help for a topic.
    risk: standard
    usage:
      - SPORE.topic.help topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs:
      - name: topichelp
        type: object
        description: Topic help information.

  - name: SPORE.topic.state
    description: State of a topic.
    risk: standard
    usage:
      - SPORE.topic.state topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs:
      - name: topicstate
        type: object
        description: Topic state.

  - name: SPORE.topic.subscribe
    description: Subscribe to a topic.
    risk: standard
    usage:
      - SPORE.topic.subscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

  - name: SPORE.topic.unsubscribe
    description: Unsubscribe to a topic.
    risk: standard
    usage:
      - SPORE.topic.unsubscribe topic=topic
    inputs:
      - name: topic
        type: string
        description: Subscription topic.
        required: true
    outputs: []

# ==================================================================================
# SPORE.permission

  - name: SPORE.permission.list
    description: Get list of permissions.
    risk: standard
    usage:
      - SPORE.permission.list
      - SPORE.permission.list node=node
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
    outputs:
      - name: permissions
        type: array
        description: List of permission-relationships.
      
  - name: SPORE.permission.request
    description: Request permission. Called by nodes, granted or denied by user.
    risk: standard
    usage:
      - SPORE.permission.request node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Capability shorthand.
        required: true
      - name: reasons
        type: array
        description: Reasons for requesting permission.
        required: false
    outputs:
      - name: Always
        type: flag
        description: Flag present if always granted.
      - name: Once
        type: flag
        description: Flag present if granted this time only.
      - name: No
        type: flag
        description: Flag present if denied.
      - name: Never
        type: flag
        description: Flag present if denied moving forward.
        notes: 
          - Not yet meaningfully implemented.
          - Currently acts the same as No.
  
  - name: SPORE.permission.grant
    description: Grant permission to a node for a capability.
    risk: standard
    usage:
      - SPORE.permission.grant node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Capability shorthand.
        required: true
    outputs: []
  
  - name: SPORE.permission.revoke
    description: Revoke permission from a node for a capability.
    risk: standard
    usage:
      - SPORE.permission.revoke node=node capability=capability
    inputs:
      - name: node
        type: string
        description: Node ID.
        required: true
      - name: capability
        type: string
        description: Capability shorthand.
        required: true
    outputs: []
  
# ==================================================================================
# other

topics: []
permissions: []
          